name: ci
on:
  pull_request: # PR: 테스트만 (합치기 전에 확인)
  push:
    branches: [main] # main: 테스트만 (합친 결과 확인)
    tags: ["v*"] # v1.0 같은 태그: 테스트 → 이미지 배포
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest # 윈도우/macOS도 지원하지만 비용 UP
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 모델 학습 및 검증 게이트 (산출물 artifacts/ 생성 후 테스트 진행)
      - run: uv run --locked --group train python -m training.train_sklearn
      - run: uv run --locked --group train python -m training.validate_model sklearn
      - run: uv run --locked --group train python -m training.train_dl
      - run: uv run --locked --group train python -m training.validate_model dl
      - run: uv run --locked --group train python -m training.export_onnx # onnx 예측기 검사에 변환 파일이 필요하다
      # uv.lock 그대로 설치 후 실행 (로컬·VS Code 와 같은 설정). dl 예측기 검사에 torch가 필요해 train 그룹을 켠다
      - run: uv run --locked --group train pytest -q

  train: # ── MLOps 2단계: 재현 가능한 학습 + 모델 검증 게이트 ──
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 학습 라이브러리(scikit-learn, torch)는 pyproject.toml 의 train 그룹. 로컬과 같은 명령이다.
      - run: mkdir -p artifacts # 커밋하지 않는 폴더라 새 checkout 에는 없다
      - run: uv run --locked --group train python -m training.train_sklearn
      - run: uv run --locked --group train python -m training.validate_model sklearn # 실패하면 여기서 중단 → 배포 안 됨
      - run: uv run --locked --group train python -m training.train_dl
      - run: uv run --locked --group train python -m training.validate_model dl
      - run: uv run --locked --group train python -m training.export_onnx # 원본 vs ONNX 예측 일치 확인 포함
      - uses: actions/upload-artifact@v7
        with:
          name: model-artifacts
          path: artifacts/

  parity: # ── Go·Rust 서비스가 Python API 와 같은 예측을 내는지 확인 ──
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: model-artifacts
          path: artifacts/
      - run: docker build -f api-go/Dockerfile -t eta-go .
      - run: docker build -f api-rust/Dockerfile -t eta-rust .
      - run: |
          docker run -d --name eta-go -p 8081:8080 eta-go
          docker run -d --name eta-rust -p 8082:8080 eta-rust
      # 기준은 학습한 원본 모델(sklearn)로 띄운 Python API. scikit-learn 은 train 그룹에 있다
      - run: MODEL_IMPL=sklearn nohup uv run --locked --group train uvicorn api.app:app --port 8080 > python-api.log 2>&1 &
      - name: 서버 준비 대기
        run: |
          for port in 8080 8081 8082; do
            curl --retry 30 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:${port}/health"
            echo
          done
      - run: uv run --locked python -m training.check_parity # 하나라도 FAIL 이면 실패 → image 작업이 돌지 않는다
      - if: failure()
        run: |
          docker logs eta-go || true
          docker logs eta-rust || true
          cat python-api.log || true

  image: # ── 배포: parity 를 통과하면 이미지 세 개 빌드·푸시 ────────
    needs: parity
    if: startsWith(github.ref, 'refs/tags/v') # v 로 시작하는 태그를 푸시했을 때만 이미지 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: model-artifacts
          path: artifacts/
      - name: 이미지 이름 (소문자)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Python API (구현체를 rule → onnx 로 교체, scikit-learn 없이 서빙)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          build-args: MODEL_IMPL=onnx
          tags: |
            ${{ env.IMAGE }}/eta-api:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-api:latest

      - name: Go 서비스
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-go/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}/eta-go:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-go:latest

      - name: Rust 서비스
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-rust/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}/eta-rust:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-rust:latest

  release: # ── 배포: 태그의 모델 파일을 GitHub Release 로 공개 ────────
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 를 만들려면 필요하다. 이 작업만 받는다
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: model-artifacts
          path: artifacts/
      - name: Release 를 만들고 모델 파일 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          artifacts/model_*.onnx artifacts/metrics_*.json
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  deploy: # ── 배포: Render 에 새 이미지 배포 요청 ────────
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Render 배포 요청
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL 이 설정되지 않아 건너뜁니다"
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/eta-api:${GITHUB_REF_NAME}"
          IMG_URL=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMG_URL}"

